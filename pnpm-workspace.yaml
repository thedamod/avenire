packages:
  - apps/*
  - packages/*

allowBuilds:
  agent-browser: true
  electron: true
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  core-js: false
  electron-winstaller: false
  protobufjs: false
  tesseract.js: false
  msgpackr-extract: false

catalog:
  "@ai-sdk/anthropic": 4.0.71
  "@ai-sdk/cohere": 4.0.57
  "@ai-sdk/fireworks": 3.0.70
  "@ai-sdk/google": 4.0.90
  "@ai-sdk/groq": 4.0.57
  "@ai-sdk/openai": 4.0.83
  "@ai-sdk/react": 4.0.130
  "@effect/platform-node": 4.0.0
  "@effect/sql-pg": 4.0.0
  "@effect/tsgo": 0.48.0
  "@effect/vitest": 4.0.0
  "@testing-library/dom": 10.4.1
  "@testing-library/react": 16.3.3
  "@types/node": 24.12.4
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.2.3
  ai: 7.0.127
  better-auth: 1.7.10
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  effect: 4.0.0
  files-sdk: 2.6.2
  happy-dom: 20.14.5
  next: 16.3.8
  pdf-lib: 1.17.1
  posthog-js: 1.435.8
  posthog-node: 5.55.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite-plus: 1.0.0

minimumReleaseAgeExclude:
  - officeparser@8.2.0
  - lucide-react@1.51.0
  - "@ai-sdk/cohere@4.0.57"
  - "@ai-sdk/google@4.0.90"
  - "@ai-sdk/provider-utils@5.0.56"
  - "@ai-sdk/provider@4.0.24"
  - "@ai-sdk/groq@4.0.57"
  - '@expo/config-plugins@57.0.11'
  - expo-sharing@57.0.24

overrides:
  # vite-plus bundles its own Vitest; the patched @effect/vitest imports it instead.
  "@effect/vitest>vitest": "-"
  # @effect/tsgo 0.48 still declares effect ^4.0.0-rc; give it our stable Effect 4.
  "@effect/tsgo>effect": "catalog:"
  "@types/node": "catalog:"
  # files-sdk/uploadthing needs UploadThing 7, whose internals use Effect 3.
  # Keep that peer runtime isolated from the application's stable Effect 4.
  "uploadthing>effect": 3.22.3
  "@uploadthing/shared>effect": 3.22.3
  "@effect/platform@0.90.3>effect": 3.22.3
  # Legacy drizzle-kit loader only uses esbuild's transform API.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  "esbuild@>=0.27.3 <0.28.1": 0.28.2
  # xcode uses the CommonJS-compatible v4 export, retained in uuid 11.
  "xcode>uuid": 11.1.1
  "http-cache-semantics@<=4.2.0": 4.3.0

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: 1.0.0
    peerDependenciesMeta:
      vitest:
        optional: true

patchedDependencies:
  "@effect/vitest@4.0.0": patches/@effect__vitest@4.0.0.patch
  files-sdk@2.6.2: patches/files-sdk@2.6.2.patch
  # No upstream fixed releases exist yet; the tests below verify these backports.
  braces@3.0.3: patches/braces@3.0.3.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  sprintf-js@1.1.3: patches/sprintf-js@1.1.3.patch
  # 4.3.0 still fails the max-stale regression despite clearing the raw audit.
  http-cache-semantics@4.3.0: patches/http-cache-semantics@4.3.0.patch
